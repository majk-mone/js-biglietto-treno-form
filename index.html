<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css">
    <title>Document</title>
</head>

<body>
    <div class="container-fluid px-0">
        <div class="hero d-flex align-items-center justify-content-center text-white">
            <div class="row w-100 justify-content-center">
                <div class="col-4 text-start">
                    <h1 class="p-3">Ticket</h1>
                </div>
                <div class="col-4 text-end">
                    <h1 class="p-3">Price</h1>
                </div>
            </div>
        </div>

        <div class="full-bg">
            <div class="row w-100 justify-content-center">

                <form class="col-4 p-4 border border-dark rounded glass" style=" max-width:400px;">

                    <div class="mb-3">
                        <label class="form-label">
                            <h3>Age</h3>
                        </label>

                        <input type="number" class="form-control bg-transparent border-dark text-dark" id="age" min="0"
                            max="120" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">
                            <h3>Km</h3>
                        </label>
                        <input type="number" class="form-control bg-transparent border-dark text-dark" id="km" required>
                    </div>

                    <button type="button" class="btn btn-outline-dark w-100" onclick="getPrice()">Calculate
                        Price</button>
                </form>

                <div class="col-4 p-4 border border-dark rounded glass" style=" max-width:400px;">
                    <div id="ticketData" class="p-4 border border-dark rounded bg-transparent text-dark">
                        <h3>Ticket Info:</h3>
                        <br>
                        <p><span class="fw-bold">Age:</span> <span id="showAge">-</span></p>
                        <p><span class="fw-bold">Distance:</span> <span id="showKm">- km</span></p>
                        <p><span class="fw-bold">Price:</span> <span id="showPrice">- €</span></p>
                    </div>
                </div>
            </div>
        </div>
    </div>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>


    <script src="js/script.js"></script>
</body>

</html>

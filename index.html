<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css">
    <title>Document</title>
</head>

<body>
    <div class="container-fluid px-0">
        <div class="hero d-flex align-items-center justify-content-center text-white">

        </div>

        <div class="full-bg">
            <div class="text-center">
                <h2>Calcola Il Prezzo Del Tuo Biglietto </h2>
                <div class="row justify-content-center">

                    <form class="ticketForm row mb-4 align-items-end border border-dark rounded glass">

                        <div class="col mb-1">

                            <label class="form-label">
                                <h5>Nome Cognome</h5>
                            </label>

                            <input type="text" class="form-control bg-transparent border-dark text-dark"
                                id="nameSurname" required>
                        </div>
                        <div class="col m-1">
                            <label class="form-label">
                                <h5>Km Da Percorrere</h5>
                            </label>
                            <input type="number" class="form-control bg-transparent border-dark text-dark" id="km"
                                required>
                        </div>
                        <div class="col m-1">
                            <label class="form-label">
                                <h5>Fascia d'età</h5>
                            </label>
                            <select class="form-select bg-transparent border-dark text-dark" id="ageRange">
                                <option class="border-dark">Maggiorenne</option>
                                <option class="border-dark">Minorenne</option>
                                <option class="border-dark">Over 65</option>
                            </select>
                        </div>
                        <div class="row m-1 ">
                            <div>
                                <button type="button" class="btn m-2 btn-outline-dark"
                                    onclick="getPrice()">Genera</button>

                                <button type="reset" class="btn m-2 btn-outline-dark" onclick="reset()">Annulla
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
            <div class="row justify-content-start">
                <div class="row border-dark rounded glass">
                    <h3 class="text-center">Il Tuo Biglietto:</h3>
                    <br>

                    <h5>Passegers Details</h5>

                    <div id="userDetails" class="col-2 text-center border border-dark rounded text-dark glass-ticket" ">

                        <div class=" row text-center fw-bold mb-2">
                        <div class="col">
                            <span class=" fw-bold">Name Surname:</span>
                        </div>

                        <div class="row text-center"></div>
                        <div class="col">
                            <p><span id="showNameSurname">-</span></p>

                        </div>
                    </div>

                </div>
                <div class="col " style="padding-left: 0px; padding-right: 0px;">
                    <div class="col-12  h-100 border border-dark rounded bg-transparent text-dark">
                        <div class="row text-center fw-bold mb-2">
                            <div class="col">Offerta</div>
                            <div class="col">Carrozza</div>
                            <div class="col">Codice CP</div>
                            <div class="col">Costo biglietto</div>
                        </div>

                        <div class="row text-center">
                            <div class="col">
                                <p><span id="seniority">- </span></p>
                            </div>
                            <div class="col ">
                                <p><span id="carrozza">- </span></p>
                            </div>
                            <div class="col ">
                                <p><span id="codiceCP">- </span></p>
                            </div>
                            <div class="col ">
                                <p><span id="showPrice">- €</span></p>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
    </div>





    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>


    <script src="js/script.js"></script>
</body>

</html>
